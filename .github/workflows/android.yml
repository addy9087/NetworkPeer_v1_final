name: Android Native Validation

on:
  pull_request:
    paths:
      - "apps/android/**"
      - "packages/api-contracts/**"
      - ".github/workflows/android.yml"
  push:
    branches: [main]
    paths:
      - "apps/android/**"
      - "packages/api-contracts/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-test:
    name: Android Development Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install Android 36 build prerequisites
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - name: Run development unit tests
        run: ./gradlew --no-daemon :app:testDevelopmentDebugUnitTest
