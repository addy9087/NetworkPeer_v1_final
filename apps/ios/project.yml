name: NetworkPeer
options:
  bundleIdPrefix: com.networkpeer
  deploymentTarget:
    iOS: "17.0"
packages:
  StripePaymentSheet:
    url: https://github.com/stripe/stripe-ios.git
    from: 24.0.0
  SocketIO:
    url: https://github.com/socketio/socket.io-client-swift.git
    from: 16.1.1
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk.git
    from: 10.0.0
settings:
  base:
    SWIFT_VERSION: "6.0"
    PRODUCT_BUNDLE_IDENTIFIER: com.networkpeer.mobile
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  NetworkPeer:
    type: application
    platform: iOS
    sources:
      - path: NetworkPeer
      - path: Sources/NetworkPeerCore
    configFiles:
      Debug: Config.Debug.xcconfig
      Release: Config.Release.xcconfig
    dependencies:
      - package: StripePaymentSheet
        product: StripePaymentSheet
      - package: SocketIO
        product: SocketIO
      - package: Firebase
        product: FirebaseCore
      - package: Firebase
        product: FirebaseMessaging
    settings:
      base:
        INFOPLIST_FILE: NetworkPeer/Info.plist
        PRODUCT_NAME: NetworkPeer
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_ENTITLEMENTS: NetworkPeer/NetworkPeer.entitlements
        SWIFT_STRICT_CONCURRENCY: complete
      configs:
        Debug:
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
          NETWORKPEER_APNS_ENVIRONMENT: development
        Release:
          SWIFT_OPTIMIZATION_LEVEL: "-O"
          SWIFT_COMPILATION_MODE: wholemodule
          DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
          ENABLE_TESTABILITY: NO
          VALIDATE_PRODUCT: YES
          NETWORKPEER_APNS_ENVIRONMENT: production
    scheme:
      testTargets:
        - NetworkPeerUITests
  NetworkPeerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: NetworkPeerUITests
    dependencies:
      - target: NetworkPeer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.networkpeer.mobile.uitests
        GENERATE_INFOPLIST_FILE: YES
